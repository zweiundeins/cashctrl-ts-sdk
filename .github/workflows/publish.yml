name: Publish to JSR

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for JSR's OIDC auth: no token secret needed, but the package
      # must be linked to this repo at https://jsr.io/@zweiundeins/cashctrl-ts-sdk/settings
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify the tag matches deno.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match deno.json version $version"
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Test before publishing
        run: |
          deno fmt --check
          deno lint
          deno check src/mod.ts scripts/*.ts
          deno test --allow-net tests/

      - name: Publish
        run: deno publish
