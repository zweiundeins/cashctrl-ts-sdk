name: Watch upstream API

# CashCtrl ships API changes without announcing them, so re-scrape their
# reference weekly and open a PR when it moved. Scraping needs no API key.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Re-scrape the published reference
        run: |
          cp spec/api.json /tmp/api-previous.json
          deno task scrape -- --refresh

      - name: Summarize what changed
        id: diff
        run: |
          if deno run --allow-read --allow-write scripts/diff-spec.ts \
               /tmp/api-previous.json spec/api.json --out /tmp/summary.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/summary.md

      # Without this, regenerating uses the OLD spec/responses.json and the
      # response types for any brand-new endpoint fall back to `unknown`.
      #
      # Probing is read-only by construction: it calls only GET endpoints whose
      # final segment is on a verb allowlist, and hard-denies the two GETs that
      # mutate plus every document read. It records field names and types, never
      # values. Point it at a disposable organisation with a read-only role
      # anyway — there is no reason for a scheduled job to touch real books.
      #
      # Skipped when the secret is absent, so forks and PRs still work and the
      # PR body keeps asking a human to do it.
      - name: Probe response shapes
        id: probe
        if: steps.diff.outputs.changed == 'true' && env.CASHCTRL_APIKEY != ''
        env:
          # The probe script reads the unprefixed names; the secrets carry the
          # TEST_ prefix so nobody can mistake them for production credentials.
          CASHCTRL_APIKEY: ${{ secrets.CASHCTRL_TEST_APIKEY }}
          CASHCTRL_DOMAINID: ${{ secrets.CASHCTRL_TEST_DOMAINID }}
        run: |
          deno run --allow-read --allow-write --allow-net --allow-env \
            scripts/probe-api.ts
          echo "probed=true" >> "$GITHUB_OUTPUT"

      - name: Regenerate the SDK
        if: steps.diff.outputs.changed == 'true'
        run: deno task generate

      - name: Verify the regenerated SDK still builds
        if: steps.diff.outputs.changed == 'true'
        run: |
          deno check src/mod.ts
          deno test --allow-read --allow-net tests/
          deno run --allow-net tests/compat/smoke.mts

      - name: Build the PR body
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            echo "The CashCtrl API reference changed upstream. This PR was"
            echo "opened automatically by \`.github/workflows/upstream.yml\`."
            echo
            cat /tmp/summary.md
            echo
            echo "---"
            echo
            echo "## Before merging"
            echo
            echo "- [ ] Review the \`spec/api.json\` diff, which is the real change."
            if [ "${{ steps.probe.outputs.probed }}" = "true" ]; then
              echo "- [x] Response shapes were re-probed by this job, so new"
              echo "      endpoints already carry real types."
            else
              echo "- [ ] Run \`deno task probe\` against an organisation so new"
              echo "      endpoints get real response types instead of \`unknown\`,"
              echo "      then \`deno task generate\` and push to this branch."
              echo "      (Set the CASHCTRL_TEST_APIKEY and"
              echo "      CASHCTRL_TEST_DOMAINID repo secrets to automate it.)"
            fi
            echo "- [ ] Note anything breaking (removed endpoints, params that"
            echo "      became mandatory) in \`CHANGELOG.md\`."
          } > /tmp/pr-body.md

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: upstream-api-changes
          title: "chore: sync with upstream CashCtrl API changes"
          body-path: /tmp/pr-body.md
          commit-message: "chore: sync generated SDK with upstream API changes"
          labels: upstream
          delete-branch: true
          add-paths: |
            spec/api.json
            spec/openapi.json
            src/generated
